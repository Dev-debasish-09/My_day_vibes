<!doctype html>
<!--
  Little Sunshine: the "Breathe" page
  Same sky and hills as the other pages. A breathing flower (six soft petals
  and a little sun) opens as you breathe in and closes as you breathe out.
  While a session runs, the sky dims and everything else fades away.
  The fixed bottom navigation and the toast are added by shared.js.
-->
<html lang="en" data-sky="peach">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <!-- Light only: a phone in dark mode must not recolor the sky -->
  <meta name="color-scheme" content="light">
  <!-- Phone status bar color. shared.js keeps this in sync with the saved sky. -->
  <meta name="theme-color" content="#FFD8BE">
  <meta name="description" content="Just follow the flower. No rush.">
  <meta name="author" content="Debasish">
  <title>Breathe · Little Sunshine</title>

  <!-- Icons and the app manifest (installable, works offline) -->
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Sunshine">

  <!-- Fonts are saved with the app (see @font-face in styles.css), so they work offline.
       Preloading the two used first avoids a visible font swap. -->
  <link rel="preload" href="fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/fraunces-italic-latin.woff2" as="font" type="font/woff2" crossorigin>

  <link rel="stylesheet" href="styles.css">

  <!-- Loaded in <head> on purpose (no defer): shared.js checks for a saved
       profile, and breathe.js applies the saved sky before the first paint. -->
  <script src="shared.js"></script>
  <script src="breathe.js"></script>
  <script src="calm-sounds.js"></script>
</head>
<!-- page-home gives the shared page layout (column, nav height, toast position, entrance).
     breathe.js adds .is-breathing to <body> while a session runs. -->
<body class="page-home page-breathe">

  <!-- ============ The scene: sky, sun, and two rolling hills (same as index.html) ============ -->
  <div class="scene" aria-hidden="true">
    <div class="sky"></div>

    <!-- On this page the sun rests behind the hills; it rises a little when you finish -->
    <div class="sun">
      <div class="sun__glow"></div>
      <div class="sun__core"></div>
    </div>

    <svg class="hill hill--back" viewBox="0 0 400 200" preserveAspectRatio="none" focusable="false">
      <path d="M0 70 C60 40 130 30 200 52 C270 74 330 40 400 48 L400 200 L0 200 Z"/>
    </svg>
    <svg class="hill hill--front" viewBox="0 0 400 200" preserveAspectRatio="none" focusable="false">
      <path d="M0 90 C80 50 150 60 220 85 C290 110 350 70 400 60 L400 200 L0 200 Z"/>
    </svg>
  </div>

  <!-- The sky gently dims while a session runs -->
  <div class="breath-dim" aria-hidden="true"></div>

  <!-- ============ Page content (scrolls over the fixed scene) ============ -->
  <div class="home">

    <header class="home-header breath-fade">
      <p class="page-eyebrow">A quiet minute</p>
      <h1 class="page-title">Let's breathe together</h1>
      <p class="page-lead">Just follow the flower. No rush.</p>
    </header>

    <main class="home-cards">

      <!-- ---------- The breathing flower (on the sky, no card) ----------
           breathe.js sets data-phase: idle, in, hold, out, rest (the hold
           after breathing out), or done; and --phase-ms, how long it lasts. -->
      <section class="breath" id="breath" data-phase="idle" aria-labelledby="breath-title">
        <h2 class="visually-hidden" id="breath-title">Breathing flower</h2>

        <div class="flower-stage" aria-hidden="true">
          <!-- Tiny lights drifting in and out (added by breathe.js) -->
          <div class="flower-particles" id="particles"></div>

          <!-- Thin ring: fills once per breath -->
          <svg class="flower-ring" viewBox="0 0 100 100" focusable="false">
            <circle class="flower-ring__track" cx="50" cy="50" r="48"/>
            <circle class="flower-ring__progress" id="ring" cx="50" cy="50" r="48" pathLength="100"/>
          </svg>

          <!-- Six soft petals in a ring, and a little sun in the middle -->
          <div class="flower">
            <span class="flower__petal" style="--i: 0; --c: var(--hill-back);  --o: 0.75"></span>
            <span class="flower__petal" style="--i: 1; --c: var(--sun-edge);   --o: 0.8"></span>
            <span class="flower__petal" style="--i: 2; --c: var(--hill-front); --o: 0.55"></span>
            <span class="flower__petal" style="--i: 3; --c: var(--sky-bottom); --o: 0.9"></span>
            <span class="flower__petal" style="--i: 4; --c: var(--button);     --o: 0.32"></span>
            <span class="flower__petal" style="--i: 5; --c: var(--sky-top);    --o: 0.9"></span>
            <span class="flower__sun"></span>
          </div>
        </div>

        <!-- Phase words: two layers so one can fade out as the next fades in -->
        <div class="breath__words" aria-hidden="true">
          <span class="breath__word is-current" id="word-a">Ready when you are.</span>
          <span class="breath__word" id="word-b"></span>
        </div>
        <!-- What screen readers hear: each new phase, once -->
        <p class="visually-hidden" id="breath-live" aria-live="polite"></p>

        <p class="breath__count" id="breath-count" aria-hidden="true"></p>
        <!-- role=timer is not announced on every tick -->
        <p class="breath__timer" id="breath-timer" role="timer" aria-label="Time left">0:56</p>

        <!-- Start and Stop share one spot, right under the flower -->
        <div class="breath__actions">
          <button class="btn btn--primary" type="button" id="breath-start">Start</button>
          <button class="btn btn--soft" type="button" id="breath-stop" hidden>Stop</button>
        </div>
      </section>

      <!-- ---------- Finished ---------- -->
      <section class="card home-card breath-finish" id="breath-finish" aria-labelledby="finish-title" hidden>
        <h2 class="breath-finish__title" id="finish-title" tabindex="-1">Well done.</h2>
        <p class="breath-finish__text">Notice how you feel now.</p>
        <div class="breath-finish__actions">
          <button class="btn btn--primary" type="button" id="breath-again">Breathe again</button>
          <a class="btn btn--soft" href="home.html">Back to today</a>
        </div>
      </section>

      <!-- ---------- Controls (fade away while breathing) ---------- -->
      <section class="card home-card breath-controls breath-fade" aria-label="Breathing controls">
        <fieldset class="breath-choice" id="breath-pattern">
          <legend class="breath-choice__legend">How to breathe</legend>
          <div class="pattern-list">
            <label class="pattern">
              <input class="pattern__input" type="radio" name="pattern" value="calm" checked>
              <span class="pattern__body">
                <span class="pattern__name">Calm</span>
                <span class="pattern__desc">For everyday stress</span>
                <span class="pattern__beats" aria-label="in 4, hold 4, out 6">4 · 4 · 6</span>
              </span>
            </label>
            <label class="pattern">
              <input class="pattern__input" type="radio" name="pattern" value="box">
              <span class="pattern__body">
                <span class="pattern__name">Box</span>
                <span class="pattern__desc">For focus</span>
                <span class="pattern__beats" aria-label="in 4, hold 4, out 4, hold 4">4 · 4 · 4 · 4</span>
              </span>
            </label>
            <label class="pattern">
              <input class="pattern__input" type="radio" name="pattern" value="sleep">
              <span class="pattern__body">
                <span class="pattern__name">Sleep</span>
                <span class="pattern__desc">For winding down</span>
                <span class="pattern__beats" aria-label="in 4, hold 7, out 8">4 · 7 · 8</span>
              </span>
            </label>
          </div>
        </fieldset>

        <fieldset class="breath-choice" id="breath-length">
          <legend class="breath-choice__legend">How long?</legend>
          <div class="breath-length__pills">
            <label class="pill">
              <input class="pill__input" type="radio" name="length" value="60" checked>
              <span class="pill__label">1 minute</span>
            </label>
            <label class="pill">
              <input class="pill__input" type="radio" name="length" value="180">
              <span class="pill__label">3 minutes</span>
            </label>
            <label class="pill">
              <input class="pill__input" type="radio" name="length" value="300">
              <span class="pill__label">5 minutes</span>
            </label>
          </div>
        </fieldset>

        <!-- Hidden by breathe.js if the Web Audio API isn't supported -->
        <div class="breath-sound">
          <button class="btn btn--link" type="button" id="breath-sound" aria-pressed="false">Sound: off</button>
        </div>
      </section>

      <!-- ---------- Calm sounds (made in the browser, no audio files) ----------
           Fades away with the controls while breathing, but keeps playing -->
      <section class="card home-card calm-card breath-fade" id="calm-sounds" aria-labelledby="calm-title">
        <h2 class="home-card__title" id="calm-title">Calm sounds</h2>
        <p class="calm-card__lead">Play one, or mix a few.</p>

        <div class="calm-tiles">
          <button class="calm-tile" type="button" data-sound="rain" aria-pressed="false">
            <span class="calm-tile__circle" aria-hidden="true">
              <svg viewBox="0 0 32 32" focusable="false">
                <path d="M9.5 17.5a5 5 0 0 1 .6-10 7 7 0 0 1 13.2 2.2 4 4 0 0 1-.8 7.8z"/>
                <path d="M11 21.5l-1.5 3M16.5 21.5l-1.5 3M22 21.5l-1.5 3"/>
              </svg>
            </span>
            <span class="calm-tile__name">Rain</span>
          </button>
          <button class="calm-tile" type="button" data-sound="ocean" aria-pressed="false">
            <span class="calm-tile__circle" aria-hidden="true">
              <svg viewBox="0 0 32 32" focusable="false">
                <path d="M4 13c3-3 6-3 8 0s5 3 8 0 5-3 8 0"/>
                <path d="M4 19c3-3 6-3 8 0s5 3 8 0 5-3 8 0"/>
                <path d="M4 25c3-3 6-3 8 0s5 3 8 0 5-3 8 0"/>
              </svg>
            </span>
            <span class="calm-tile__name">Ocean</span>
          </button>
          <button class="calm-tile" type="button" data-sound="wind" aria-pressed="false">
            <span class="calm-tile__circle" aria-hidden="true">
              <svg viewBox="0 0 32 32" focusable="false">
                <path d="M4 12.5h14.5a3.5 3.5 0 1 0-3.5-3.5"/>
                <path d="M4 17.5h20a3.5 3.5 0 1 1-3.5 3.5"/>
                <path d="M4 22.5h8"/>
              </svg>
            </span>
            <span class="calm-tile__name">Wind</span>
          </button>
          <button class="calm-tile" type="button" data-sound="crickets" aria-pressed="false">
            <span class="calm-tile__circle" aria-hidden="true">
              <svg viewBox="0 0 32 32" focusable="false">
                <path d="M19.5 6.5a9.5 9.5 0 1 0 6 13.2A8 8 0 0 1 19.5 6.5z"/>
                <path d="M24 6v3M22.5 7.5h3M27 12.5v2M26 13.5h2"/>
              </svg>
            </span>
            <span class="calm-tile__name">Crickets</span>
          </button>
        </div>

        <div class="calm-volume">
          <svg class="calm-volume__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/>
          </svg>
          <label class="visually-hidden" for="calm-volume">Volume</label>
          <input class="calm-volume__slider" type="range" id="calm-volume" min="0" max="100" step="1" value="60">
          <svg class="calm-volume__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/>
            <path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/>
          </svg>
        </div>
      </section>
    </main>
  </div>

</body>
</html>
