<!doctype html>
<!--
  Little Sunshine: welcome + name page (Step 1)
  A soft morning sky, a sun that rises as you move through three screens,
  and a glass card that greets you by name.
-->
<html lang="en" data-sky="peach">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover lets the sky run under the iPhone notch; safe-area padding keeps content clear of it -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <!-- Light only: a phone in dark mode must not recolor the sky -->
  <meta name="color-scheme" content="light">
  <!-- Phone status bar color. app.js keeps this in sync with the chosen sky. -->
  <meta name="theme-color" content="#FFD8BE">
  <meta name="description" content="A little place made just for you.">
  <meta name="author" content="Debasish">
  <title>Little Sunshine</title>

  <!-- Link previews (messages, social apps).
       SITE LINK: https://my-day-vibes.vercel.app/  <- if the site moves, change the two
       lines marked below, and SITE_URL at the top of shared.js. (Previews need a full
       address here: the apps that read these tags don't run JavaScript.) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Little Sunshine">
  <meta property="og:title" content="Little Sunshine">
  <meta property="og:description" content="A little place to feel lighter every day.">
  <meta property="og:url" content="https://my-day-vibes.vercel.app/">                  <!-- site link -->
  <meta property="og:image" content="https://my-day-vibes.vercel.app/images/preview.png"> <!-- site link -->
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="A soft peach sky with a sun rising over pink hills, and the words Little Sunshine.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Little Sunshine">
  <meta name="twitter:description" content="A little place to feel lighter every day.">
  <meta name="twitter:image" content="https://my-day-vibes.vercel.app/images/preview.png">

  <!-- Icons and the app manifest (installable, works offline) -->
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Sunshine">

  <!-- Fonts are saved with the app (see @font-face in styles.css), so they work offline.
       Preloading the two used first avoids a visible font swap. -->
  <link rel="preload" href="fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/fraunces-italic-latin.woff2" as="font" type="font/woff2" crossorigin>

  <link rel="stylesheet" href="styles.css">

  <!-- Loaded in <head> on purpose (no defer): it applies the saved sky before the
       first paint so returning visitors never see a flash of the default colors. -->
  <script src="shared.js"></script>
  <script src="app.js"></script>

  <!-- If JavaScript is off, at least show the first screen -->
  <noscript><style>.screen--name { opacity: 1; transform: none; }</style></noscript>
</head>
<body>

  <!-- ============ The scene: sky, sun, and two rolling hills (decorative) ============ -->
  <div class="scene" aria-hidden="true">
    <div class="sky"></div>

    <!-- The sun sits between the sky and the hills, so it rises from behind them -->
    <div class="sun">
      <div class="sun__glow"></div>
      <div class="sun__core"></div>
    </div>

    <svg class="hill hill--back" viewBox="0 0 400 200" preserveAspectRatio="none" focusable="false">
      <path d="M0 70 C60 40 130 30 200 52 C270 74 330 40 400 48 L400 200 L0 200 Z"/>
    </svg>
    <svg class="hill hill--front" viewBox="0 0 400 200" preserveAspectRatio="none" focusable="false">
      <path d="M0 90 C80 50 150 60 220 85 C290 110 350 70 400 60 L400 200 L0 200 Z"/>
    </svg>
  </div>

  <!-- ============ The glass card holding the three screens ============ -->
  <main class="stage">
    <div class="card" id="card">

      <!-- Screen 1: Name -->
      <section class="screen screen--name" id="screen-name" aria-labelledby="name-title">
        <h1 class="title" id="name-title" tabindex="-1" data-focus>
          Hello, <span class="name-accent" id="name-echo">you</span>.
        </h1>
        <p class="lead">This little place is made just for you. What should I call you?</p>

        <form id="name-form" novalidate>
          <label class="visually-hidden" for="name-input">Your name or nickname</label>
          <input
            class="field-input"
            id="name-input"
            name="name"
            type="text"
            maxlength="24"
            placeholder="Your name or nickname"
            autocomplete="nickname"
            autocapitalize="words"
            spellcheck="false"
            enterkeyhint="next"
            aria-describedby="name-hint">
          <!-- Error message lives here; aria-live so screen readers hear it -->
          <p class="hint" id="name-hint" aria-live="polite"></p>
          <button class="btn btn--primary" type="submit">Continue</button>
        </form>
      </section>

      <!-- Screen 2: Pick your sky -->
      <section class="screen" id="screen-sky" aria-labelledby="sky-title" hidden>
        <h1 class="title" id="sky-title" tabindex="-1" data-focus>
          Pick your sky, <span class="name-accent" data-name>friend</span>.
        </h1>
        <p class="lead">This will be the color of your days here. You can change it anytime.</p>

        <!-- A real radio group: one tab stop, arrow keys move the selection -->
        <div class="sky-grid" id="sky-grid" role="radiogroup" aria-labelledby="sky-title">
          <button class="tile" type="button" role="radio" aria-checked="true" tabindex="0" data-sky="peach">
            <span class="tile__swatch" aria-hidden="true">
              <span class="tile__sun"></span>
              <span class="tile__check"><svg viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-7"/></svg></span>
            </span>
            <span class="tile__label">Peach sunrise</span>
          </button>
          <button class="tile" type="button" role="radio" aria-checked="false" tabindex="-1" data-sky="lavender">
            <span class="tile__swatch" aria-hidden="true">
              <span class="tile__sun"></span>
              <span class="tile__check"><svg viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-7"/></svg></span>
            </span>
            <span class="tile__label">Lavender dusk</span>
          </button>
          <button class="tile" type="button" role="radio" aria-checked="false" tabindex="-1" data-sky="sea">
            <span class="tile__swatch" aria-hidden="true">
              <span class="tile__sun"></span>
              <span class="tile__check"><svg viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-7"/></svg></span>
            </span>
            <span class="tile__label">Sea breeze</span>
          </button>
          <button class="tile" type="button" role="radio" aria-checked="false" tabindex="-1" data-sky="mint">
            <span class="tile__swatch" aria-hidden="true">
              <span class="tile__sun"></span>
              <span class="tile__check"><svg viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-7"/></svg></span>
            </span>
            <span class="tile__label">Mint garden</span>
          </button>
        </div>

        <div class="actions actions--row">
          <button class="btn btn--link" type="button" id="sky-back">Back</button>
          <button class="btn btn--primary" type="button" id="sky-choose">Choose this sky</button>
        </div>
      </section>

      <!-- Screen 3: Personal greeting -->
      <section class="screen" id="screen-greet" aria-labelledby="greet-name" hidden>
        <p class="greet-time" id="greet-time">Good morning,</p>
        <h1 class="greet-name" id="greet-name" tabindex="-1" data-focus>friend</h1>
        <p class="welcome" id="greet-welcome" hidden></p>
        <p class="message" id="greet-message"></p>
        <p class="day-line" id="greet-day"></p>

        <div class="actions actions--stack">
          <button class="btn btn--primary" type="button" id="open-day">Open my day</button>
          <button class="btn btn--link" type="button" id="change-setup">Change name or sky</button>
        </div>
      </section>

    </div>

    <!-- The creator's signature, small, on the hills; it fades in last -->
    <p class="signature signature--welcome">made with <span class="signature__heart" aria-hidden="true">♡</span><span class="visually-hidden">love</span> by <span class="signature__name">Debasish</span></p>
  </main>

</body>
</html>
